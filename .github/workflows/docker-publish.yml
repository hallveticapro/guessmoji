name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/hallveticapro/guessmoji

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run independent quality checks
        shell: bash
        run: |
          set -euo pipefail
          # Give each check its own process group so interruption also stops its workers.
          set -m
          checks=(lint typecheck test)
          pids=()
          statuses=()
          interrupted=0
          launching=1
          log_dir="$(mktemp -d "$RUNNER_TEMP/guessmoji-quality.XXXXXX")"
          stop_checks() {
            interrupted="$1"
            # Keep signals caught during launch so forked children inherit defaults.
            if (( launching == 0 )); then trap '' INT TERM; fi
            if (( ${#pids[@]} != 0 )); then
              for pid in "${pids[@]}"; do
                kill -TERM -- "-$pid" 2>/dev/null || true
              done
            fi
          }
          trap 'stop_checks 130' INT
          trap 'stop_checks 143' TERM
          for check in "${checks[@]}"; do
            if (( interrupted != 0 )); then break; fi
            npm run "$check" >"$log_dir/$check.log" 2>&1 &
            pids+=("$!")
            if (( interrupted != 0 )); then stop_checks "$interrupted"; fi
          done
          launching=0
          if (( interrupted != 0 )); then stop_checks "$interrupted"; fi
          failed=0
          for index in "${!pids[@]}"; do
            status=0
            wait "${pids[$index]}" || status=$?
            statuses+=("$status")
            if (( status != 0 )); then failed=1; fi
          done
          # A signal can interrupt wait before its child exits; reap every PID again.
          if (( interrupted != 0 )); then
            for index in "${!pids[@]}"; do
              status=0
              wait "${pids[$index]}" || status=$?
              statuses[$index]="$status"
              if (( status != 0 )); then failed=1; fi
            done
          fi
          for index in "${!pids[@]}"; do
            printf '::group::%s (exit %s)\n' "${checks[$index]}" "${statuses[$index]}"
            cat "$log_dir/${checks[$index]}.log"
            printf '::endgroup::\n'
          done
          if (( interrupted != 0 )); then exit "$interrupted"; fi
          exit "$failed"

  build-and-push:
    if: ${{ always() }}
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.repository_owner == 'hallveticapro'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Note skipped publish for pull request or non-canonical owner
        if: github.event_name == 'pull_request' || github.repository_owner != 'hallveticapro'
        run: |
          echo "Skipping GHCR push for event '${{ github.event_name }}' and repository owner '${{ github.repository_owner }}'." >> "$GITHUB_STEP_SUMMARY"
          echo "The image still builds with the required target name: ${{ env.IMAGE_NAME }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Build and maybe push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.repository_owner == 'hallveticapro' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://guessmoji.mrhallsclass.com
